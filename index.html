<title>444 姉のスマホ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;position:fixed;inset:0}
body{font-family:-apple-system,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:center;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .18s}
.scr.on{opacity:1;pointer-events:auto}
.sb{position:absolute;top:0;right:0;height:47px;padding:16px 28px 0 0;display:flex;gap:6px;align-items:center}
.sb svg{display:block}
.hi{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px}
/* lock */
#s1{background:linear-gradient(180deg,#f2c93a 0%,#ecbd2a 60%,#e4ad1c 100%)}
#s1 .date{position:absolute;top:64px;width:100%;text-align:center;color:rgba(255,238,170,.95);font-size:21px;font-weight:600}
#s1 .time{position:absolute;top:88px;width:100%;text-align:center;color:rgba(255,238,160,.97);font-size:100px;font-weight:600;letter-spacing:-2px;line-height:1.1}
#s1 svg.fl{position:absolute;left:0;top:200px}
.notif{opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .35s,transform .35s;position:absolute;left:12px;right:12px;bottom:128px;height:68px;border-radius:22px;background:rgba(62,80,112,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 14px;color:#fff}
.lineic{width:40px;height:40px;border-radius:10px;background:#06c755;display:flex;align-items:center;justify-content:center;margin-right:12px;flex:none}
.notif.show{opacity:1;transform:none;pointer-events:auto}
.notif .t{font-size:15px;font-weight:600}.notif .b{font-size:15px;opacity:.9;margin-top:1px}
.notif .n{margin-left:auto;font-size:13px;opacity:.7;align-self:flex-start;margin-top:12px}
.rb{position:absolute;bottom:56px;width:50px;height:50px;border-radius:25px;background:rgba(40,40,40,.38);display:flex;align-items:center;justify-content:center}
/* chat */
#s2{background:#c9d6e3}
#s2 .hd{position:absolute;top:47px;left:0;right:0;height:44px;display:flex;align-items:center;padding:0 14px;color:#111}
#s2 .hd b{font-size:17px;margin-left:10px;font-weight:600}
#s2 .hd .ic{margin-left:auto;display:flex;gap:18px}
#msgs{position:absolute;top:98px;left:0;right:0;bottom:84px;padding:6px 12px;display:flex;flex-direction:column;gap:9px;justify-content:flex-end;overflow:hidden}
.dt{align-self:center;background:rgba(0,0,0,.22);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px;margin:4px 0}
.r{align-self:flex-end;background:#ffe200;color:#111;padding:8px 12px;border-radius:16px;font-size:14.5px;max-width:240px;line-height:1.35}
.lw{display:flex;align-items:flex-end;gap:8px}
.l{background:#fff;color:#111;padding:8px 12px;border-radius:16px;font-size:14.5px;max-width:240px;line-height:1.35}
.av{width:34px;height:34px;border-radius:17px;background:#1c2530;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.stamp{align-self:flex-end;width:200px;height:194px;background:none;border-radius:0;overflow:visible}
.stamp img{width:100%;height:100%;object-fit:contain;display:block}
.wb{width:168px;height:126px;border-radius:14px;background:#00b140;overflow:hidden;cursor:pointer}
.wb img{width:100%;height:100%;object-fit:cover}
#s2 .bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#f7f7f7;display:flex;align-items:flex-start;padding:10px 12px 0;gap:14px}
.in{flex:1;height:34px;border-radius:17px;background:#fff;border:1px solid #ddd;color:#aaa;font-size:15px;padding:6px 12px;display:flex;justify-content:space-between}
/* viewer */
#s3{background:#000}
#s3 .hd{position:absolute;top:47px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff}
#s3 .hd b{font-size:15px;font-weight:600}
#s3 .big{position:absolute;top:300px;left:0;width:390px;height:292px;background:#00b140}
#s3 .big img{width:100%;height:100%;object-fit:contain}
#s3 .ft{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px}
#s3 .pen{position:absolute;bottom:92px;right:16px}

function img(el,src){if(src){var i=document.createElement("img");i.src=src;el.appendChild(i)}}
img(document.getElementById("wb1"),WHITEBOARD_SRC);img(document.getElementById("big"),WHITEBOARD_SRC);
img(document.getElementById("stamp"),STAMP_SRC);
if(AVATAR_SRC)document.querySelectorAll(".av").forEach(function(a){img(a,AVATAR_SRC)});
if(!STAMP_SRC)document.getElementById("stamp").style.background="#00b140";
/* 花びら */
var p="";for(var i=0;i<24;i++)p+='<ellipse cx="0" cy="-70" rx="15" ry="58" transform="rotate('+(i*15)+')"/>';
document.getElementById("pt").innerHTML=p;
var q="";for(i=0;i<24;i++)q+='<ellipse cx="0" cy="-48" rx="11" ry="40" transform="rotate('+(i*15)+')"/>';
document.getElementById("pt2").innerHTML=q;
/* ステータスバー: 時刻・キャリア無し / Wi-Fi + 充電100% */

 s.innerHTML='<svg width="18" height="13" viewBox="0 0 18 13" fill="'+c+'"><path d="M9 12.500l2.200-2.400a3.200 3.200 0 00-4.400 0zM9 7.200c1.600 0 3 .6 4 1.600l1.200-1.300A7.300 7.300 0 009 5.300c-2.100 0-4 .8-5.200 2.200L5 8.800A5.700 5.700 0 019 7.200zM9 2c2.900 0 5.500 1.100 7.400 3L17.700 3.700A11.500 11.500 0 009.100.200 11.500 11.500 0 00.300 3.700L1.600 5A10.500 10.500 0 019 2z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.500" fill="none" stroke="'+c+'" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.200" fill="'+c+'"/><path d="M24 4.500v4c.9-.3 1.500-1.200 1.500-2s-.6-1.700-1.500-2z" fill="'+c+'" opacity=".5"/></svg>'});
/* 画面遷移: 通知タップ→トーク→画像タップ→拡大 / ×で戻る / #1 #2 #3 で直接表示 / Rで最初へ */
var nt=document.getElementById("nt"),tm,armed=false;
var S=[1,2,3].map(function(n){return document.getElementById("s"+n)});
function go(n){if(n==1){clearTimeout(tm);armed=false;nt.classList.remove("show")}S.forEach(function(s,i){s.classList.toggle("on",i==n-1)})}
nt.addEventListener("click",function(e){e.stopPropagation();go(2)});
S[0].addEventListener("click",function(){if(!armed){armed=true;tm=setTimeout(function(){nt.classList.add("show")},NOTIF_DELAY)}});
document.getElementById("wb1").addEventListener("click",function(){go(3)});
document.getElementById("close").addEventListener("click",function(){go(2)});
document.addEventListener("keydown",function(e){if(e.key=="r"||e.key=="R")go(1)});
function hash(){var n=parseInt(location.hash.slice(1));if(n>=1&&n<=3)go(n)}
window.addEventListener("hashchange",hash);hash();
/* 実機(390x844pt)にそのまま合わせて拡縮 */
function fit(){var k=Math.min(innerWidth/390,innerHeight/844),st=document.getElementById("stage");
 st.style.transform="translate(-50%,-50%) scale("+k+")"}
addEventListener("resize",fit);fit();
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
</script></body></html>
